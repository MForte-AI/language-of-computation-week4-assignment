<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Report</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0da; --accent: #2f5d8a; --accent-text: #ffffff;
    --warn-bg: #fff4e0; --warn-text: #7a4a00; --ok: #2e6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #212125; --text: #ececef; --muted: #a0a0a8;
      --line: #34343a; --accent: #6fa3d6; --accent-text: #0e1a26;
      --warn-bg: #3a2c12; --warn-text: #f3c97a; --ok: #7cc28a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .open { display: inline-block; background: var(--accent); color: var(--accent-text);
          padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .open:focus-within { outline: 3px solid var(--line); }
  .open input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #status { margin: 14px 0 0; color: var(--muted); }
  #status.error { color: #c0392b; }
  .unfinished { color: #c0392b; font-weight: 600; margin: 0 0 16px; }
  .run { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 20px; margin-top: 24px; }
  .run h2 { font-size: 19px; margin: 0; }
  .run .meta { color: var(--muted); margin: 2px 0 16px; }
  .counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px; margin-bottom: 10px; }
  .count { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .count b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); font-size: 13px; }
  .only13 { color: var(--muted); margin: 0 0 18px; }
  h3 { font-size: 16px; margin: 20px 0 8px; }
  details > summary { cursor: pointer; font-weight: 600; margin: 20px 0 8px; }
  .none { color: var(--ok); margin: 4px 0; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { background: var(--bg); position: sticky; top: 0; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.val { font-family: ui-monospace, Menlo, monospace; white-space: pre; }
  td.val .empty { color: var(--muted); font-family: inherit; font-style: italic; }
  td.todo { background: var(--warn-bg); color: var(--warn-text); }
  td.todo div + div { margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Morning report</h1>
  <p class="sub">Every run of ingest.py, newest first. Open ingestion-log.json from the week4-assignment folder.</p>
  <label class="open">Open ingestion-log.json
    <input type="file" id="file" accept=".json,application/json">
  </label>
  <p id="status">No log opened yet.</p>
  <div id="runs"></div>
</main>

<script>
const statusEl = document.getElementById("status");
const runsEl = document.getElementById("runs");

document.getElementById("file").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let runs;
    try {
      runs = JSON.parse(reader.result);
      if (!Array.isArray(runs)) throw new Error("the file is not a list of runs");
    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "Could not read " + file.name + ": " + err.message;
      runsEl.replaceChildren();
      return;
    }
    statusEl.className = "";
    statusEl.textContent = file.name + ": " + runs.length + (runs.length === 1 ? " run" : " runs") + ", newest first.";
    showRuns(runs);
  };
  reader.readAsText(file);
});

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  for (const child of children) node.append(child);
  return node;
}

function valueCell(value) {
  const td = el("td", { class: "val" });
  if (value === "" || value === undefined || value === null) td.append(el("span", { class: "empty" }, "(empty)"));
  else td.textContent = value;
  return td;
}

function table(headers, rows, makeRow) {
  const thead = el("thead", {}, el("tr", {}, ...headers.map((h) => el("th", {}, h))));
  const tbody = el("tbody");
  const frag = document.createDocumentFragment();
  for (const row of rows) frag.append(makeRow(row));
  tbody.append(frag);
  return el("div", { class: "scroll" }, el("table", {}, thead, tbody));
}

function showRuns(runs) {
  runsEl.replaceChildren();
  const total = runs.length;
  runs.slice().reverse().forEach((run, i) => {
    const c = run.counts || {};
    const section = el("section", { class: "run" });
    section.append(
      el("h2", {}, "Run " + (total - i) + " of " + total),
      el("p", { class: "meta" }, "Ran " + run.ran_at + " on " + run.file +
        (run.finished === false ? "" : " \u00b7 finished"))
    );
    if (run.finished === false) {
      section.append(el("p", { class: "unfinished" },
        "This run did not finish, so nothing from it was kept in books.db. Error: " + (run.error || "unknown")));
    }

    const counts = el("div", { class: "counts" });
    for (const [key, label] of [["read", "Read"], ["loaded", "Loaded"], ["updated", "Updated"],
                                ["skipped", "Skipped"], ["rejected", "Rejected"], ["repairs", "Repairs"]]) {
      counts.append(el("div", { class: "count" }, el("b", {}, String(c[key] ?? 0)), el("span", {}, label)));
    }
    section.append(counts,
      el("p", { class: "only13" }, "Rows whose only problem is in isbn13 (not listed): " + (c.isbn13_only_problems ?? 0)));

    const attention = run.needs_attention || [];
    section.append(el("h3", {}, "Wrong ISBN, Missing ISBN and Warnings (" + attention.length + ")"));
    if (attention.length === 0) section.append(el("p", { class: "none" }, "None in this run."));
    else section.append(table(
      ["Line", "book_id", "Title", "isbn as it arrived", "isbn13 as it arrived", "Note", "What to do"],
      attention,
      (r) => el("tr", {},
        el("td", { class: "num" }, String(r.line)),
        el("td", { class: "num" }, r.book_id === "" ? "(none)" : r.book_id),
        el("td", {}, r.title),
        valueCell(r.isbn_as_arrived),
        valueCell(r.isbn13_as_arrived),
        el("td", {}, r.note),
        el("td", { class: "todo" }, ...(r.what_to_do || []).map((t) => el("div", {}, t))))
    ));

    const skipped = run.not_loaded || [];
    const details = el("details");
    if (skipped.length <= 100) details.open = true;
    details.append(el("summary", {}, "Rows not loaded, with their reason (" + skipped.length + ")"));
    if (skipped.length === 0) details.append(el("p", { class: "none" }, "None in this run."));
    else details.append(table(
      ["Line", "book_id", "Title", "Reason"],
      skipped,
      (r) => el("tr", {},
        el("td", { class: "num" }, String(r.line)),
        el("td", { class: "num" }, r.book_id),
        el("td", {}, r.title),
        el("td", {}, r.reason))
    ));
    section.append(details);

    const fix = run.still_to_fix || [];
    const fixDetails = el("details");
    if (fix.length <= 100) fixDetails.open = true;
    fixDetails.append(el("summary", {}, "Still to fix: every book in the database that still needs a person (" + fix.length + ")"));
    if (fix.length === 0) fixDetails.append(el("p", { class: "none" }, "Nothing left to fix."));
    else fixDetails.append(table(
      ["book_id", "Title", "isbn", "isbn13", "Note", "What to do"],
      fix,
      (r) => el("tr", {},
        el("td", { class: "num" }, r.book_id === "" ? "(none)" : r.book_id),
        el("td", {}, r.title),
        valueCell(r.isbn),
        valueCell(r.isbn13),
        el("td", {}, r.note),
        el("td", { class: "todo" }, ...(r.what_to_do || []).map((t) => el("div", {}, t))))
    ));
    section.append(fixDetails);
    runsEl.append(section);
  });
}
</script>
</body>
</html>
